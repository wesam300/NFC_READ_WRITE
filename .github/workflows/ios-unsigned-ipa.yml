name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH"
            exit 1
          fi
          rm -rf Payload NFC_READ_WRITE-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          # The IPA must contain a Payload folder with the .app inside it.
          zip -qry NFC_READ_WRITE-unsigned.ipa Payload
          rm -rf Payload
          ls -lh NFC_READ_WRITE-unsigned.ipa
          unzip -l NFC_READ_WRITE-unsigned.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFC_READ_WRITE-unsigned-ipa
          path: NFC_READ_WRITE-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to a GitHub release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NFC Read Write v1.0.${{ github.run_number }}
          files: NFC_READ_WRITE-unsigned.ipa
          body: |
            بناء تلقائي غير موقّع (Unsigned IPA) لتطبيق NFC Read Write.

            طريقة التثبيت:
            1. نزّل ملف `NFC_READ_WRITE-unsigned.ipa` من قسم Assets.
            2. وقّعه بأي أداة توقيع (Sideloadly / ESign / AltStore / TrollStore).
            3. ثبّته على الآيفون.

            ملاحظة: صلاحية NFC على iOS تتطلب حساب Apple Developer مدفوع عند التوقيع.
